name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to keep CI snappy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint: snakemake --lint + ruff over the Python scripts.
  # Cheap (~3 min). Runs on every PR.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (snakemake + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: workflow/envs/lint.yaml
          environment-name: gflow-lint
          cache-environment: true
          cache-downloads: true

      - name: Snakemake lint
        shell: bash -l {0}
        run: |
          snakemake --lint --configfile test/config.yaml

      - name: Ruff
        shell: bash -l {0}
        run: |
          ruff check workflow/scripts

  # ---------------------------------------------------------------------------
  # 2. End-to-end test on a downsampled chr20 region (NA12878 + 2 synthetic).
  # The test driver under test/ generates synthetic FASTQs from a small slice
  # of GRCh38 chr20, so CI does not depend on external mirrors being up.
  # Budget: ~10-15 min on the default GH runner.
  # ---------------------------------------------------------------------------
  e2e-test:
    name: end-to-end (chr20 slice)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Micromamba (pipeline driver env)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: workflow/envs/lint.yaml
          environment-name: gflow-driver
          cache-environment: true
          cache-downloads: true

      - name: Create test-data builder env
        # Calling setup-micromamba twice in one job breaks the post-job cleanup
        # of the first action (it removes a shell file the second one needed),
        # so we create the secondary env with `micromamba env create` instead.
        shell: bash -l {0}
        run: |
          micromamba env create -y -n gflow-test-driver -f workflow/envs/test-driver.yaml

      - name: Cache snakemake conda envs
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: snakemake-conda-${{ runner.os }}-${{ hashFiles('workflow/envs/*.yaml') }}
          restore-keys: |
            snakemake-conda-${{ runner.os }}-

      - name: Generate downsampled chr20 reference + synthetic FASTQs
        shell: bash -l {0}
        run: |
          micromamba run -n gflow-test-driver bash test/scripts/build_test_data.sh

      - name: Run pipeline (test config)
        shell: bash -l {0}
        run: |
          micromamba run -n gflow-driver make test CORES=2

      - name: Check expected outputs exist
        shell: bash -l {0}
        run: |
          bash test/scripts/check_outputs.sh

      - name: Upload report on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cohort-qc-report
          path: results/report/cohort_qc.html
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            logs/
            .snakemake/log/
          retention-days: 14
